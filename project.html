<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="page-title">Project Details · Mohamed El Mahdaoui</title>
<meta name="description" content="Detailed cybersecurity engineering project report, architecture breakdown, and artifacts by Mohamed El Mahdaoui.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="portfolio-data.js"></script>
<style>
:root {
  --bg: #07080d;
  --pan: #0e1018;
  --pan-sub: #141724;
  --ink: #e8eaf3;
  --dim: #7e8397;
  --line: #222637;
  --edge: #3a4060;
  --role: #ff2e93;
  --proj: #27d3ff;
  --cert: #ffb020;
  --org: #9b7bff;
  --r: 16px;
  --f: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --m: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--f);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}
a { color: inherit; text-decoration: none; }

/* ── NAV BAR ─────────────────────────────────────────── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: color-mix(in oklab, var(--bg) 85%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1160px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 600 14px var(--f);
  color: var(--dim);
  border: 1px solid var(--line);
  padding: 7px 14px;
  border-radius: 99px;
  transition: .2s;
  background: var(--pan);
}
.back-btn:hover {
  color: var(--ink);
  border-color: var(--proj);
  transform: translateX(-3px);
}
.nav-profile {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.nav-name {
  font-weight: 700;
  color: var(--ink);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-link {
  font: 600 13px var(--f);
  color: var(--dim);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 5px 12px;
  transition: .2s;
}
.nav-link:hover {
  color: var(--ink);
  border-color: var(--role);
}
.nav-link.contact {
  background: var(--role);
  border-color: var(--role);
  color: #fff;
}

/* ── CONTAINER ───────────────────────────────────────── */
.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 36px 20px 0;
}

/* ── HERO ────────────────────────────────────────────── */
.hero {
  border: 1px solid var(--line);
  border-radius: 24px;
  background: radial-gradient(circle at top right, color-mix(in oklab, var(--proj) 15%, transparent), transparent 60%),
              radial-gradient(circle at bottom left, color-mix(in oklab, var(--role) 10%, transparent), transparent 70%),
              var(--pan);
  padding: 44px 40px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}
.domain-tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.dom-tag {
  font: 700 11px var(--m);
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 99px;
  border: 1px solid currentColor;
  background: rgba(0,0,0,0.25);
}
.hero h1 {
  font: 900 clamp(32px, 5.5vw, 64px)/1.08 var(--f);
  letter-spacing: -.035em;
  margin-bottom: 12px;
}
.hero-tagline {
  color: var(--dim);
  font-size: clamp(17px, 2.2vw, 21px);
  max-width: 820px;
  line-height: 1.5;
  margin-bottom: 24px;
}
.meta-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 500 14px var(--m);
  color: var(--dim);
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 6px 14px;
  border-radius: 99px;
}
.meta-badge {
  color: #fff;
  font-weight: 700;
  background: color-mix(in oklab, var(--proj) 25%, var(--pan));
  border-color: var(--proj);
}

/* ── ACTION LINKS BAR ─────────────────────────────────── */
.actions-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
}
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: 99px;
  font: 700 14px var(--f);
  border: 1.5px solid var(--line);
  transition: all .2s;
  background: var(--pan-sub);
}
.action-btn:hover {
  transform: translateY(-2px);
  border-color: var(--proj);
}
.action-btn.primary {
  background: var(--proj);
  border-color: var(--proj);
  color: #07080d;
}
.action-btn.disabled {
  opacity: .5;
  cursor: not-allowed;
  border-style: dashed;
}
.action-btn.disabled:hover {
  transform: none;
  border-color: var(--line);
}

/* ── SECTION CARDS ────────────────────────────────────── */
.sec-title {
  margin: 48px 0 20px;
  font: 700 12px var(--m);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--proj);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sec-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ── 3-COLUMN PILLARS ─────────────────────────────────── */
.pillars {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}
.pillar {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--pan);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
.pillar::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--c, var(--proj));
}
.pillar h3 {
  font: 700 12px var(--m);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--c, var(--proj));
}
.pillar p {
  color: var(--ink);
  font-size: 15px;
  line-height: 1.7;
}

/* ── ARCHITECTURE BOX ─────────────────────────────────── */
.arch-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--pan);
  padding: 28px;
}
.arch-card h4 {
  font: 700 16px var(--f);
  margin-bottom: 12px;
  color: var(--ink);
}
.arch-flow {
  background: #05060a;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 20px;
  font: 14px/1.7 var(--m);
  color: var(--proj);
  overflow-x: auto;
  white-space: pre-wrap;
}

/* ── HIGHLIGHTS LIST ─────────────────────────────────── */
.highlights-list {
  list-style: none;
  display: grid;
  gap: 12px;
}
.highlights-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--pan);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 15px;
  color: var(--dim);
}
.highlights-list li b {
  color: var(--ink);
}
.bullet-icon {
  color: var(--proj);
  font-weight: 800;
  font-size: 16px;
  flex-shrink: 0;
}

/* ── MEDIA & GALLERY ─────────────────────────────────── */
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.media-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--pan);
  transition: transform .2s, border-color .2s;
}
.media-card:hover {
  transform: translateY(-3px);
  border-color: var(--proj);
}
.media-card img {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  display: block;
  border-bottom: 1px solid var(--line);
}
.media-caption {
  padding: 12px 16px;
  font-size: 13px;
  color: var(--dim);
}
.empty-media {
  border: 1.5px dashed var(--line);
  border-radius: 16px;
  background: color-mix(in oklab, var(--pan) 50%, transparent);
  padding: 40px 24px;
  text-align: center;
  color: var(--dim);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.empty-media code {
  font: 13px var(--m);
  background: var(--bg);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  color: var(--proj);
}

/* ── TECH CHIPS ──────────────────────────────────────── */
.chs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.ch {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 4px 14px 4px 5px;
  font-size: 13px;
  transition: border-color .2s, transform .2s;
  background: var(--pan);
}
.ch:hover {
  border-color: var(--c, var(--proj));
  transform: translateY(-2px);
}
.ch i {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 700 9px var(--m);
  color: #fff;
  font-style: normal;
  background: var(--c, #6b7280);
}

/* ── BOTTOM NAV (PREV/NEXT) ──────────────────────────── */
.bottom-nav {
  margin-top: 60px;
  padding-top: 30px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.pn-btn {
  display: inline-flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 20px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--pan);
  transition: all .2s;
  min-width: 200px;
}
.pn-btn:hover {
  border-color: var(--proj);
  transform: translateY(-2px);
}
.pn-lbl {
  font: 700 11px var(--m);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dim);
}
.pn-title {
  font: 700 16px var(--f);
  color: var(--ink);
}
.project-selector {
  background: var(--pan);
  color: var(--ink);
  border: 1px solid var(--line);
  font: 600 14px var(--f);
  padding: 10px 16px;
  border-radius: 12px;
  outline: none;
  cursor: pointer;
}
.project-selector:hover, .project-selector:focus {
  border-color: var(--proj);
}

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 768px) {
  .hero { padding: 28px 20px; }
  .nav-inner { padding: 12px 16px; }
  .bottom-nav { flex-direction: column; align-items: stretch; }
  .pn-btn { min-width: 100%; }
}
</style>
</head>
<body>

<!-- TOP NAV -->
<nav>
  <div class="nav-inner">
    <a href="index.html#classic" class="back-btn">
      <span>←</span> Back to Graph &amp; CV
    </a>
    <div class="nav-profile">
      <span class="nav-name" id="nav-author">Mohamed El Mahdaoui</span>
      <div class="nav-links">
        <a id="nav-github" href="#" target="_blank" rel="noopener" class="nav-link">GitHub</a>
        <a id="nav-linkedin" href="#" target="_blank" rel="noopener" class="nav-link">LinkedIn</a>
        <a id="nav-contact" href="#" class="nav-link contact">Contact</a>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT WRAPPER -->
<main class="wrap" id="main-content">
  <div style="padding: 60px 0; text-align: center; color: var(--dim); font-family: var(--m);" id="loading-state">
    Loading project telemetry from portfolio.json…
  </div>
</main>

<script>
// ── Tech Color Tokens ──────────────────────────────────────────
const TC = {
  Python:"#3776ab",FastAPI:"#009688",LangGraph:"#1c7c6c",Gemini:"#8e75ff",Wazuh:"#2f80ed",
  OpenSearch:"#005eb8",VirusTotal:"#394eff",PyOD:"#e4572e",SHAP:"#ff0051",Drain3:"#6c5ce7",
  Docker:"#2496ed","scikit-learn":"#f89939",Cloudflare:"#f38020",WARP:"#f38020","Entra ID":"#0078d4",
  CASB:"#7a5af8",VirtualBox:"#183a61",pfSense:"#212d6e",Suricata:"#e8532b",Zeek:"#1b7f9e",
  Sysmon:"#0078d4",CrowdSec:"#6e56cf","Atomic Red Team":"#d62828",BadBlood:"#b00020",
  "Burp Suite":"#ff6633",GraphQL:"#e10098",React:"#149eca",ADB:"#3ddc84",Android:"#2fa866",
  Nmap:"#2a7ab0",SQLite:"#0f80cc",Qualys:"#ed2e26",ServiceNow:"#4aa83a",Azure:"#0078d4",
  Splunk:"#e0603a",Fortinet:"#ee3124",Cisco:"#1ba0d7",Zscaler:"#0076b6",Linux:"#e8a800",
  Java:"#e76f00","C/C++":"#00599c",Bash:"#4eaa25",PHP:"#777bb4",Laravel:"#ff2d20",
  JavaScript:"#d9b800",Oracle:"#c74634",GitLab:"#fc6d26","Active Directory":"#0078d4",
  Metasploit:"#2a6fbb",BPMN:"#f4a322",ArchiMate:"#5b84c4","AWS Secrets Manager":"#ff9900",
  "AWS CloudTrail":"#ff9900","AWS CloudWatch":"#ff9900","AWS S3":"#ff9900","AWS SNS":"#ff9900",
  "AWS EC2":"#ff9900","Law 05-20":"#4457c8","Law 09-08":"#4457c8","GDPR":"#4457c8","LPM":"#4457c8",
  "ISO 27001":"#4457c8","NIST CSF":"#4457c8",
  "GitLab CI/CD":"#fc6d26","DevSecOps":"#20c997","SAST/DAST":"#fd7e14","OWASP Top 10":"#0077b6","REST APIs":"#6f42c1",
  "Cryptography":"#00b4d8","AES-256":"#0077b6","ECDH":"#7209b7","X3DH":"#f72585","Double Ratchet":"#4361ee","HMAC-SHA256":"#4cc9f0",
  "Node.js":"#68a063","WebSockets":"#343a40","AI Assistant":"#9b5de5"
};
const FD = {
  soc: ["SOC / Detection", "#ff9500"],
  ai: ["AI SecOps", "#18c79a"],
  cloud: ["Cloud & Zero Trust", "#4d8dff"],
  off: ["Offensive", "#ff3b4e"],
  grc: ["GRC & OT", "#a566f5"]
};

const tc = n => TC[n] || (/^AWS/.test(n) ? "#ff9900" : /Law|GDPR|ISO|NIST|CIS|PCI/.test(n) ? "#4457c8" : "#6b7280");
const ab = n => /^AWS/.test(n) ? "AW" : n.split(/[\s\-\/]+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase() || n.slice(0,2).toUpperCase();
const chip = n => `<span class="ch" style="--c:${tc(n)}"><i>${ab(n)}</i>${n}</span>`;

function renderProject(p, allProjs, meta) {
  document.getElementById('page-title').textContent = `${p.title} · Mohamed El Mahdaoui`;

  // Update nav
  document.getElementById('nav-author').textContent = meta.name;
  document.getElementById('nav-github').href = meta.github;
  document.getElementById('nav-linkedin').href = meta.linkedin;
  document.getElementById('nav-contact').href = `mailto:${meta.email}`;

  const c = p.color || (FD[p.domains[0]] ? FD[p.domains[0]][1] : '#27d3ff');
  document.documentElement.style.setProperty('--proj', c);

  // Domains HTML
  const domHtml = p.domains.map(d => {
    const info = FD[d] || [d, c];
    return `<span class="dom-tag" style="color:${info[1]}">● ${info[0]}</span>`;
  }).join('');

  // Prev / Next index
  const curIdx = allProjs.findIndex(x => x.id === p.id);
  const prevP = curIdx > 0 ? allProjs[curIdx - 1] : allProjs[allProjs.length - 1];
  const nextP = curIdx < allProjs.length - 1 ? allProjs[curIdx + 1] : allProjs[0];

  // Action links
  const ghLink = p.github
    ? `<a href="${p.github}" target="_blank" rel="noopener" class="action-btn primary">↗ View on GitHub</a>`
    : `<span class="action-btn disabled">GitHub (Private Enterprise Repo)</span>`;

  const reportLink = p.report
    ? `<a href="${p.report}" target="_blank" rel="noopener" class="action-btn">📄 Technical Report</a>`
    : `<span class="action-btn disabled">📄 Full Report (Upon Request)</span>`;

  const videoLink = p.video
    ? `<a href="${p.video}" target="_blank" rel="noopener" class="action-btn">▶ Watch Demo Video</a>`
    : `<span class="action-btn disabled">▶ Video Demo (Lab Session)</span>`;

  // Highlights
  const highlightsHtml = (p.highlights || [
    p.why,
    p.what,
    p.outcome
  ]).map(h => `<li><span class="bullet-icon">▸</span><span>${h}</span></li>`).join('');

  // Media
  let mediaHtml = '';
  if (p.images && p.images.length > 0) {
    mediaHtml = `<div class="media-grid">` + p.images.map((src, idx) => `
      <div class="media-card">
        <img src="${src}" alt="${p.title} screenshot ${idx+1}">
        <div class="media-caption">Figure ${idx+1}: System output and operational telemetry</div>
      </div>
    `).join('') + `</div>`;
  } else {
    mediaHtml = `
      <div class="empty-media">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.4">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        <p><strong>Screenshots &amp; Architecture Diagrams</strong></p>
        <p style="max-width:540px;font-size:14px">Drop screenshots into this folder and reference them inside <code>portfolio.json</code> under <code>"images": ["my_screenshot.png"]</code> to automatically render them in this gallery.</p>
      </div>`;
  }

  // Video embed section if video file or URL is present
  let videoEmbed = '';
  if (p.video) {
    videoEmbed = `
      <div class="sec-title">// Live Video Demonstration</div>
      <div style="border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#000;margin-bottom:30px">
        <video controls style="width:100%;max-height:540px;display:block">
          <source src="${p.video}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>`;
  }

  const html = `
    <!-- HERO -->
    <section class="hero">
      <div class="domain-tags">${domHtml}</div>
      <h1>${p.title}</h1>
      <p class="hero-tagline">${p.tagline || p.short}</p>

      <div class="meta-strip">
        <span class="meta-item">🏢 ${p.built_at}</span>
        <span class="meta-item">📅 ${p.year}</span>
        ${p.status ? `<span class="meta-item" style="color:#f59e0b;border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.1)">🚧 ${p.status}</span>` : ''}
      </div>

      ${p.status ? `
      <div style="margin-top:18px;padding:12px 18px;border-radius:12px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#f59e0b;font-size:14px;display:flex;align-items:center;gap:10px">
        <span>🚧</span>
        <span><strong>Active Project · Under Development:</strong> Architecture, automated pipelines, and modules are currently being actively engineered for Academic Year 2026/2027.</span>
      </div>` : ''}

      <div class="actions-bar">
        ${ghLink}
        ${reportLink}
        ${videoLink}
      </div>
    </section>

    <!-- VIDEO EMBED IF PRESENT -->
    ${videoEmbed}

    <!-- 3-PILLAR DEEP DIVE -->
    <div class="sec-title">// Problem, Architecture &amp; Measured Impact</div>
    <div class="pillars">
      <div class="pillar" style="--c:#ff3b4e">
        <h3>01 · The Problem / Why It Matters</h3>
        <p>${p.why}</p>
      </div>
      <div class="pillar" style="--c:${c}">
        <h3>02 · What I Built &amp; Engineering</h3>
        <p>${p.what}</p>
      </div>
      <div class="pillar" style="--c:#2fe39a">
        <h3>03 · Measured Outcome &amp; Impact</h3>
        <p>${p.outcome}</p>
      </div>
    </div>

    <!-- ARCHITECTURE FLOW -->
    ${p.architecture ? `
      <div class="sec-title">// Architecture &amp; Data Pipeline</div>
      <div class="arch-card">
        <h4>Telemetry &amp; Execution Pipeline</h4>
        <pre class="arch-flow">${p.architecture}</pre>
      </div>
    ` : ''}

    <!-- KEY TECHNICAL HIGHLIGHTS -->
    <div class="sec-title">// Technical Highlights &amp; Innovations</div>
    <ul class="highlights-list">
      ${highlightsHtml}
    </ul>

    <!-- TECH STACK -->
    <div class="sec-title">// Technology &amp; Tooling Stack</div>
    <div class="chs">
      ${p.stack.map(chip).join('')}
    </div>

    <!-- MEDIA / SCREENSHOTS -->
    <div class="sec-title">// Media, Screenshots &amp; Evidence</div>
    ${mediaHtml}

    <!-- BOTTOM NAV: PREV / NEXT / QUICK SELECTOR -->
    <div class="bottom-nav">
      <a href="project.html?id=${prevP.id}" class="pn-btn">
        <span class="pn-lbl">← Previous Project</span>
        <span class="pn-title">${prevP.title}</span>
      </a>

      <div>
        <select class="project-selector" id="p-select" aria-label="Jump to project">
          ${allProjs.map(x => `<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.title} (${x.year})</option>`).join('')}
        </select>
      </div>

      <a href="project.html?id=${nextP.id}" class="pn-btn" style="text-align:right">
        <span class="pn-lbl">Next Project →</span>
        <span class="pn-title">${nextP.title}</span>
      </a>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;

  document.getElementById('p-select').onchange = (e) => {
    window.location.search = `?id=${e.target.value}`;
  };
}

// ── BOOTSTRAP ──────────────────────────────────────────────────
function loadData() {
  if (window.PORTFOLIO_DATA) return Promise.resolve(window.PORTFOLIO_DATA);
  return fetch('portfolio.json')
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .catch(err => {
      if (window.PORTFOLIO_DATA) return window.PORTFOLIO_DATA;
      throw err;
    });
}

loadData()
  .then(data => {
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('id') || 'lucid';
    const proj = data.projects.find(p => p.id === pid) || data.projects[0];
    renderProject(proj, data.projects, data.meta);
  })
  .catch(err => {
    document.getElementById('main-content').innerHTML = `
      <div style="padding:40px;background:var(--pan);border:1px solid var(--line);border-radius:18px;max-width:600px;margin:40px auto">
        <h2 style="color:#ff4d4d;margin-bottom:12px">⚠ Could not load portfolio.json</h2>
        <p style="color:var(--dim);margin-bottom:16px">${err.message}</p>
        <p style="color:var(--dim)">Make sure <code>portfolio.json</code> is accessible in the same directory.</p>
        <a href="index.html" class="back-btn" style="margin-top:20px;display:inline-block">← Return to Main Page</a>
      </div>`;
  });
</script>
</body>
</html>
